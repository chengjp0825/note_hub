question: 两个项目中最难的硬件问题是什么？如何解决与排查？
roles: [hardware]
companies: [全志科技]
topic: 测试与系统工程
tags: [故障定位]
answers:
  hardware: |
    参考回答：这道题没有脱离项目事实的唯一答案。建议按“现象—假设—最小实验—证据—修复—回归”讲一个真实案例：先给出可量化现象和复现条件，再按电源/时钟/复位/接口/器件/软件边界逐层隔离，用替换板、示波器、逻辑分析仪和日志缩小范围，最后说明根因、修复和如何增加测试点或保护避免复发。不要把“换料后好了”当成根因，也不要隐去版本、温度和负载条件。
