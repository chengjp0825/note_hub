id: allwinner-soldering-011
question: 板卡焊接质量如何评估？
roles: [hardware]
companies: [全志科技]
topic: 测试与系统工程
tags: [生产制造, 测试测量]
answers:
  hardware: |
    参考回答：焊接质量要同时看外观、尺寸/位置、连通性和可靠性。量产通常结合 AOI/AXI、首件显微检查、X-Ray（BGA/QFN）、开短路测试、边界扫描或功能测试；关键焊点还要做截面、拉力/剪切或温循、振动等抽检。重点缺陷包括虚焊、桥连、少锡/多锡、立碑、偏移、焊盘润湿不良和器件空洞超限。评价标准应引用 IPC/企业工艺规范，并把来料、钢网、回流曲线和返修记录纳入闭环。
