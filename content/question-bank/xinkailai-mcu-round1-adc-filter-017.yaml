id: xinkailai-mcu-round1-adc-filter-017
question: >-
  ADC 采样数据跳动较大时，硬件和软件滤波如何选型？中值、均值、滑动平均、一阶滞后分别适合什么信号？
roles: [embedded-mcu]
companies: [新凯来]
topic: 采集与控制
tags: [数据采集, 控制算法]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 先区分噪声类型、信号带宽、允许延迟和异常脉冲，再决定硬件 RC、采样频率和软件算法。
    - 中值滤波适合去除孤立尖峰；均值适合近似白噪声但会引入窗口延迟；滑动平均适合连续测量的平滑；一阶滞后计算量小，适合需要可控响应速度的慢变量。
    - 采样端还要检查参考源、阻抗、布局、接地和 ADC 采样时间，不能只靠软件滤波掩盖硬件问题。
