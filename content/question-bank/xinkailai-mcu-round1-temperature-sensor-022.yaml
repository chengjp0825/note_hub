id: xinkailai-mcu-round1-temperature-sensor-022
question: >-
  热电偶和 PT100 的测温原理分别是什么？热电偶为什么需要做冷端补偿？
roles: [embedded-mcu]
companies: [新凯来]
topic: 采集与控制
tags: [传感器, 数据采集]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 热电偶利用不同金属的塞贝克效应产生热电势；PT100 利用铂电阻随温度变化的特性测温。
    - 热电偶测到的是测量端与参考端的温差，参考端温度变化会直接影响结果，因此需要测量冷端温度并补偿。
    - PT100 要考虑两线/三线/四线接法、引线电阻、恒流激励、自热和 ADC 分辨率；热电偶要关注微弱信号、滤波和线材类型。
