id: nova-gtx-use-021
question: GTX 在单板中具体用于什么？是板间互联、对外接口还是其他用途？
roles: [hardware, fpga]
companies: [诺瓦星云]
topic: 高速接口与 FPGA
tags: [FPGA, 高速串行接口]
answers:
  hardware: |
    参考回答：GTX 的实际用途必须从原理图、FPGA 工程和链路对端回答，例如 PCIe、Aurora、SGMII/10G 以太网或板间 SerDes；不要只说“用于高速通信”。应说明 lane 数、线速率、编码/协议、参考时钟、AC 耦合、通道长度和连接器，并给出眼图、IBIS/S 参数或误码测试证据。7 系列/Zynq 的 GTX 配置和功耗应以 UG476/器件数据手册及 Vivado Transceiver Wizard 为准。
  fpga: |
    参考回答：FPGA 侧补充 GT wizard 生成的收发器配置、PLL、RX equalization、CDR、reset/bring-up 状态机和协议 IP。用 link training、PRBS/BERT、远端回环和 error counter 验证，而不是仅凭用户逻辑“有数据”判断链路可靠。
