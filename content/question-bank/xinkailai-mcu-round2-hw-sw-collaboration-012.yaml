id: xinkailai-mcu-round2-hw-sw-collaboration-012
question: >-
  硬件同事判定问题是软件 bug，但你怀疑是硬件问题，出现分歧时应该如何协同定位？
roles: [embedded-mcu]
companies: [新凯来]
topic: 测试与系统工程
tags: [故障定位, 系统架构]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 先统一现象、复现条件、时间线和判定标准，不把“感觉”当结论。
    - 设计最小化实验：替换板卡/固件、旁路模块、抓取总线和电源波形，并让软件日志与硬件测点对齐。
    - 用可证伪的假设列表推进，每次只改变一个变量，记录版本、样本和结果。
    - 结论落到共同的缺陷单和验证计划，必要时先加保护性 workaround，再继续追根因。
