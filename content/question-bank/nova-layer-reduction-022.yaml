id: nova-layer-reduction-022
question: 如果从 12 层板压缩到 10 层，设计难度体现在哪些方面？板层减少对成本和技术有什么影响？
roles: [hardware]
companies: [诺瓦星云]
topic: 电源与硬件设计
tags: [PCB, 信号完整性]
answers:
  hardware: |
    参考回答：12 层压到 10 层不是简单删掉两张铜层，要重新平衡电源/地平面、阻抗、参考平面连续性、层间距、扇出和高速布线资源。难点包括 DDR/SerDes/MIPI 的层切换与过孔、串扰/EMI、热扩散、电源完整性和制造叠层公差；成本可能下降，但若增加盲埋孔、特殊材料或调试返工，未必更便宜。应由 PCB 厂提供可制造叠层，结合 SI/PI 仿真、阻抗 coupon 和样板验证后再定。
