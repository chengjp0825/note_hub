id: nova-dcdc-current-012
question: 常用 DCDC 的电流规格有哪些？除 2A 外还用到几安培的规格？
roles: [hardware]
companies: [诺瓦星云]
topic: 电源与硬件设计
tags: [电源设计, 器件选型, DCDC]
answers:
  hardware: |
    参考回答：DCDC 电流规格不是越大越好，应按每路连续/峰值负载、启动浪涌、瞬态、效率、热和成本分档，例如小电流 LDO/Buck、2A 级和更高电流级别分别服务不同电源域。先用实测或功耗预算得到最大/典型/待机电流，再留出瞬态和温升裕量，校核电感饱和、开关管限流、铜箔和连接器。具体“用到几安培”必须以项目 BOM 和负载表为准，不能凭经验报数。
