id: xinkailai-mcu-round1-freeze-debug-023
question: >-
  设备现场偶发死机，在没有仿真器的情况下应该如何定位问题？
roles: [embedded-mcu]
companies: [新凯来]
topic: 测试与系统工程
tags: [故障定位, 可靠性]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 先启用独立看门狗和复位原因记录，保留故障前后的环形日志、任务心跳、栈水位和关键状态。
    - 通过串口/Flash 黑匣子、GPIO 时序和外部示波器确认是 CPU 卡死、总线阻塞、电源异常还是内存破坏。
    - 增加断言、栈溢出检查、堆统计、超时和故障计数，采用二分禁用模块或故障注入缩小范围。
    - 现场记录固件版本、配置、环境、复现概率和恢复动作，避免只收集“重启后正常”。
