id: nova-power-test-015
question: 如何测试电源纹波、上电时序和时钟信号？
roles: [hardware]
companies: [诺瓦星云]
topic: 测试与系统工程
tags: [测试测量]
answers:
  hardware: |
    参考回答：电源测试要同时抓目标电源轨、PG/RESET 和时钟：启动时测 ramp、先后顺序、过冲/下冲和稳定时间；稳态和负载阶跃时测纹波、噪声、恢复时间和温升。示波器使用短地弹簧/同轴或差分探头，在负载端测量，并记录带宽限制、采样率、探头衰减和负载条件。时钟则测频率、占空比、抖动和相噪，不能把电源纹波探头接法直接套到高速差分时钟。
