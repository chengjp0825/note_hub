id: xinkailai-mcu-round2-modbus-timeout-011
question: >-
  Modbus 主机轮询 20 个站点时，如果其中一个从站掉线，如何避免把整条总线拖垮？
roles: [embedded-mcu]
companies: [新凯来]
topic: 通信与网络
tags: [工业总线, 通信协议, Modbus]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 每个站点使用独立响应超时和有限重试，不允许一个站点无限阻塞轮询任务。
    - 连续失败后熔断或降级，记录离线状态并采用较长退避周期，其他站点继续服务。
    - 严格控制 485 收发方向、帧间隔、CRC 和总线占用，避免超时后迟到响应污染下一帧。
    - 恢复时采用探测和状态切换，向上层报告离线/恢复事件并保留诊断计数。
