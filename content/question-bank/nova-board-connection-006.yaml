id: nova-board-connection-006
question: 核心板与底板通过什么方式连接？连接器与接口定义如何考虑？
roles: [hardware]
companies: [诺瓦星云]
topic: 测试与系统工程
tags: [系统架构]
answers:
  hardware: |
    参考回答：核心板与底板的连接方式必须以实际结构和信号速率决定，常见是高速板对板连接器，低速控制/电源可配合排针或线束。接口定义先按电源、地、复位/启动、低速总线、高速差分和调试信号分组，预留地针、屏蔽、编码防呆和热插拔/ESD策略；高速信号要核对连接器插损、阻抗、串扰、长度和回流路径。最后以连接器 datasheet、SI 仿真、实测眼图和插拔/振动可靠性验证为准，不能只凭“能连上”。
