id: xinkailai-mcu-round1-motor-selection-021
question: >-
  步进电机和伺服电机有什么区别？在设备场景中应该如何选型？
roles: [embedded-mcu]
companies: [新凯来]
topic: 采集与控制
tags: [执行器]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 步进电机控制简单、低速定位成本低，但可能失步、效率和高速转矩有限；伺服带反馈闭环，动态性能、过载和位置可靠性更好。
    - 按负载转矩、惯量、速度、加速度、定位精度、连续运行时间、噪声、成本和安全要求选型。
    - 说明是否需要编码器、抱闸、回零、限位、故障反馈和急停，并用实际工况而非只看额定功率判断。
