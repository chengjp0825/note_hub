id: xinkailai-mcu-round2-reliability-007
question: >-
  工业设备需要 7×24 小时高可用，软件可以依靠哪些机制实现？
roles: [embedded-mcu]
companies: [新凯来]
topic: 测试与系统工程
tags: [可靠性]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 用独立看门狗、任务心跳、栈/堆监控和异常复位原因记录发现失控。
    - 对通信、传感器和执行器设置超时、重试、熔断、降级和安全状态，避免单点故障拖垮系统。
    - 采用参数校验、掉电保护、日志追踪、在线升级回滚和启动自检。
    - 通过长时间压力、断电、异常注入和老化测试验证，而不是只依赖正常流程测试。
