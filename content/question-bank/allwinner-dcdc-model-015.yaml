id: allwinner-dcdc-model-015
question: 用过哪一颗 DC-DC 型号？其最高效率是多少，如何从官方资料确认？
roles: [hardware]
companies: [全志科技]
topic: 电源与硬件设计
tags: [电源设计, 器件选型]
answers:
  hardware: |
    参考回答：这里必须说清实际项目中的料号、输入输出范围、最大连续电流、开关频率、封装和温度条件，不能只报一个“最高效率”数字。最高效率应从该料号最新 datasheet 的效率曲线和测试条件确认，再结合实际电感、电容、PCB 和负载复测；效率峰值通常只对应特定 Vin、Vout 和负载。面试时可补充为什么选它、替代料、环路/热设计和量产测试方法。
