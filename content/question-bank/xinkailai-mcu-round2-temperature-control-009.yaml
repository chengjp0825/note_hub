id: xinkailai-mcu-round2-temperature-control-009
question: >-
  要做到 ±0.5℃ 的控温精度，除了 PID 参数调节外，采样端和执行端还能做哪些优化？
roles: [embedded-mcu]
companies: [新凯来]
topic: 采集与控制
tags: [控制算法, 数据采集, 执行器]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 采样端要校准传感器，改善布点、热耦合、激励稳定性和 ADC 参考，采用合适的滤波与采样周期。
    - 执行端要减少功率器件死区和迟滞，优化 PWM/继电器周期、驱动分辨率、散热和负载响应。
    - 做前馈、限幅、抗积分饱和、斜坡设定和分段控制，避免测量噪声被放大。
    - 用阶跃、稳态、环境变化和满载测试分别确认精度、超调、响应时间与长期漂移。
