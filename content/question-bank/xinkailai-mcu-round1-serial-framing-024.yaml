id: xinkailai-mcu-round1-serial-framing-024
question: >-
  串口字节流遇到半包、粘包和校验错误时，应该如何处理？
roles: [embedded-mcu]
companies: [新凯来]
topic: 通信与网络
tags: [板级总线, 通信协议]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 串口本身只提供字节流，协议必须定义帧头、长度、类型、序号和 CRC/校验和。
    - 接收端用状态机和环形缓冲区累计数据：半包继续等待，粘包循环解析，多余字节保留给下一帧。
    - 长度非法、超时或校验错误时丢弃到下一个可能的帧头并重新同步，设置缓冲区上限和错误计数。
    - 解析与业务解耦，避免在中断中做完整协议处理；压力测试边界长度、噪声和连续帧。
