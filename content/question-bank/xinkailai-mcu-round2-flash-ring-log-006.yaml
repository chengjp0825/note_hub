id: xinkailai-mcu-round2-flash-ring-log-006
question: >-
  使用 Flash 存放设备运行日志时，环形日志应该如何设计？
roles: [embedded-mcu]
companies: [新凯来]
topic: MCU 与嵌入式软件
tags: [固件设计, MCU]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 设计固定大小记录、序号、时间戳、长度、版本和 CRC，按页组织并维护写指针。
    - 启动时扫描有效记录，依据单调序号恢复最新位置；空间不足时按页擦除并覆盖最旧记录。
    - 处理掉电半写、擦写寿命和磨损均衡，必要时双份元数据或提交标记保证原子性。
    - 日志写入应异步批量化，不能阻塞控制环，并提供导出、分级和丢弃计数。
