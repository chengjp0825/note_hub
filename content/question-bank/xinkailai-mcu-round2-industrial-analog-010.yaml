id: xinkailai-mcu-round2-industrial-analog-010
question: >-
  MCU 如何对接 0-10V 电压信号和 4-20mA 电流信号？电流环抗干扰应该怎么做？
roles: [embedded-mcu]
companies: [新凯来]
topic: 采集与控制
tags: [工业模拟量, 数据采集]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 0-10V 通过分压、输入保护、缓冲和 ADC 采样接入，校核量程、阻抗、过压和地电位差。
    - 4-20mA 通过精密采样电阻转换为电压，考虑回路供电、开路检测、端子保护和 ADC 参考。
    - 抗干扰包括屏蔽双绞线、单点接地、隔离/共模保护、RC 滤波、合理走线和数字侧异常值判断。
    - 标定零点与满量程，区分 4mA 以下的断线/故障区间和有效测量范围。
