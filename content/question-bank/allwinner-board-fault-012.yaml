id: allwinner-board-fault-012
question: 板子除网口外还有哪些现象或故障？如何定位？
roles: [hardware]
companies: [全志科技]
topic: 测试与系统工程
tags: [故障定位]
answers:
  hardware: |
    参考回答：先把“现象”量化并建立复现条件，再按电源、时钟/复位、接口电气、器件焊接和软件配置分层排查。先测各电源轨上电时序、纹波和负载电流，再检查晶振/复位释放；随后用示波器、万用表、逻辑分析仪分别验证 USB、MIPI、DDR、串口等接口。对间歇性故障要记录温度、负载和复位次数，交换已知正常板或替换模块做 A/B 对比。每次只改变一个变量，并保留波形、日志和版本信息，最后用回归测试确认修复没有引入新问题。
