id: xinkailai-mcu-round1-second-largest-025
question: >-
  手撕代码：一次遍历找出数组中的第二大数，并处理最大值重复的边界情况。
roles: [embedded-mcu]
companies: [新凯来]
topic: MCU 与嵌入式软件
tags: [C 语言, 固件设计]
answers:
  embedded-mcu: |-
    ## 作答要点
    - 维护最大值和严格小于最大值的次大值，一次遍历即可完成，时间复杂度 O(n)、额外空间 O(1)。
    - 先明确数组长度、是否允许重复、是否存在第二个不同值，以及无解时如何返回。
    - 当新值大于最大值时先把最大值下移；当新值介于两者之间时更新次大值；等于最大值时按题意忽略或单独记录。
    - 使用合适的无效标记，避免直接用 0 作为初值导致负数数组或全相等数组判断错误。
